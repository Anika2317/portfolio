# Site-wide settings
# ------------------
title: Open Coding 
description: "Class of 2026"
owner_name: Anika Seksaria
github_username: Anika2317 
github_repo: "portfolio" 
baseurl: "/portfolio" 
url: "https://Anika2317.github.io"
future: true

# Build settings
# --------------
incremental: true
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Minima-specific settings
# ------------------------
minima:
  skin: dark
  social_links:
    - { platform: github, user_url: "https://github.com/open-coding-society" }
    - { platform: x, user_url: "https://x.com/Open_Coding" }
    - { platform: youtube, user_url: "https://www.youtube.com/@OpenCodingSociety" } 
  nav_pages:
    - navigation/blog.md
    - navigation/search.md
    - navigation/about.md